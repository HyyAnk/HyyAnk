<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" role="img" aria-labelledby="signal-title signal-desc">
  <title id="signal-title">Eternity by HyyAnk at 128 BPM</title>
  <desc id="signal-desc">A red, black, and cyan concept music player with independently animated equalizer bars.</desc>

  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11161c"/>
      <stop offset="0.52" stop-color="#080a0d"/>
      <stop offset="1" stop-color="#0d1116"/>
    </linearGradient>
    <radialGradient id="cover" cx="35%" cy="28%" r="85%">
      <stop offset="0" stop-color="#34121a"/>
      <stop offset="0.58" stop-color="#120b0f"/>
      <stop offset="1" stop-color="#050608"/>
    </radialGradient>
    <linearGradient id="red-bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7d1227"/>
      <stop offset="0.55" stop-color="#f02e4d"/>
      <stop offset="1" stop-color="#ff5871"/>
    </linearGradient>
    <linearGradient id="cyan-bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#006d7d"/>
      <stop offset="0.58" stop-color="#00d9f5"/>
      <stop offset="1" stop-color="#8cf4ff"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#8aa0ad" stroke-opacity=".055"/>
    </pattern>
    <filter id="red-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cyan-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .ui { font-family: "Segoe UI", Arial, sans-serif; }
    .mono { font-family: Consolas, "Courier New", monospace; }
    .bar {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      animation-timing-function: cubic-bezier(.42, 0, .22, 1);
      animation-iteration-count: infinite;
      will-change: transform;
    }
    .b01 { animation-name: beat-a; animation-duration: .9375s; animation-delay: -.18s; }
    .b02 { animation-name: beat-f; animation-duration: 1.171875s; animation-delay: -.81s; }
    .b03 { animation-name: beat-c; animation-duration: .703125s; animation-delay: -.29s; }
    .b04 { animation-name: beat-h; animation-duration: 1.40625s; animation-delay: -1.07s; }
    .b05 { animation-name: beat-d; animation-duration: .8203125s; animation-delay: -.52s; }
    .b06 { animation-name: beat-b; animation-duration: 1.0546875s; animation-delay: -.11s; }
    .b07 { animation-name: beat-g; animation-duration: 1.2890625s; animation-delay: -.94s; }
    .b08 { animation-name: beat-e; animation-duration: .9375s; animation-delay: -.63s; }
    .b09 { animation-name: beat-a; animation-duration: 1.171875s; animation-delay: -.37s; }
    .b10 { animation-name: beat-c; animation-duration: .8203125s; animation-delay: -.74s; }
    .b11 { animation-name: beat-f; animation-duration: 1.40625s; animation-delay: -.23s; }
    .b12 { animation-name: beat-d; animation-duration: .703125s; animation-delay: -.48s; }
    .b13 { animation-name: beat-h; animation-duration: 1.0546875s; animation-delay: -.91s; }
    .b14 { animation-name: beat-b; animation-duration: 1.2890625s; animation-delay: -.32s; }
    .b15 { animation-name: beat-e; animation-duration: .9375s; animation-delay: -.86s; }
    .b16 { animation-name: beat-g; animation-duration: 1.171875s; animation-delay: -.14s; }
    .b17 { animation-name: beat-c; animation-duration: 1.40625s; animation-delay: -1.19s; }
    .b18 { animation-name: beat-a; animation-duration: .8203125s; animation-delay: -.41s; }
    .b19 { animation-name: beat-f; animation-duration: 1.0546875s; animation-delay: -.69s; }
    .b20 { animation-name: beat-d; animation-duration: .703125s; animation-delay: -.17s; }
    .b21 { animation-name: beat-b; animation-duration: 1.2890625s; animation-delay: -1.02s; }
    .b22 { animation-name: beat-h; animation-duration: .9375s; animation-delay: -.57s; }
    .b23 { animation-name: beat-e; animation-duration: 1.171875s; animation-delay: -.27s; }
    .b24 { animation-name: beat-g; animation-duration: .8203125s; animation-delay: -.72s; }
    .b25 { animation-name: beat-a; animation-duration: 1.40625s; animation-delay: -.46s; }
    .b26 { animation-name: beat-f; animation-duration: 1.0546875s; animation-delay: -.89s; }
    .b27 { animation-name: beat-d; animation-duration: .703125s; animation-delay: -.34s; }
    .b28 { animation-name: beat-c; animation-duration: 1.2890625s; animation-delay: -1.11s; }
    .b29 { animation-name: beat-h; animation-duration: .9375s; animation-delay: -.21s; }
    .b30 { animation-name: beat-b; animation-duration: 1.171875s; animation-delay: -.76s; }
    .b31 { animation-name: beat-g; animation-duration: .8203125s; animation-delay: -.38s; }
    .b32 { animation-name: beat-e; animation-duration: 1.40625s; animation-delay: -.97s; }
    .b33 { animation-name: beat-f; animation-duration: 1.0546875s; animation-delay: -.55s; }
    .b34 { animation-name: beat-a; animation-duration: .703125s; animation-delay: -.08s; }

    @keyframes beat-a { 0% { transform: scaleY(.18) } 16% { transform: scaleY(.72) } 31% { transform: scaleY(.34) } 57% { transform: scaleY(.96) } 76% { transform: scaleY(.43) } 100% { transform: scaleY(.61) } }
    @keyframes beat-b { 0% { transform: scaleY(.52) } 13% { transform: scaleY(.22) } 39% { transform: scaleY(.88) } 58% { transform: scaleY(.47) } 84% { transform: scaleY(1) } 100% { transform: scaleY(.35) } }
    @keyframes beat-c { 0% { transform: scaleY(.28) } 21% { transform: scaleY(.94) } 44% { transform: scaleY(.41) } 62% { transform: scaleY(.66) } 79% { transform: scaleY(.19) } 100% { transform: scaleY(.82) } }
    @keyframes beat-d { 0% { transform: scaleY(.79) } 18% { transform: scaleY(.37) } 35% { transform: scaleY(.59) } 54% { transform: scaleY(.25) } 73% { transform: scaleY(.91) } 100% { transform: scaleY(.48) } }
    @keyframes beat-e { 0% { transform: scaleY(.31) } 12% { transform: scaleY(.55) } 28% { transform: scaleY(.24) } 49% { transform: scaleY(1) } 68% { transform: scaleY(.62) } 87% { transform: scaleY(.36) } 100% { transform: scaleY(.74) } }
    @keyframes beat-f { 0% { transform: scaleY(.68) } 24% { transform: scaleY(.29) } 43% { transform: scaleY(.81) } 64% { transform: scaleY(.17) } 82% { transform: scaleY(.58) } 100% { transform: scaleY(.92) } }
    @keyframes beat-g { 0% { transform: scaleY(.23) } 19% { transform: scaleY(.63) } 34% { transform: scaleY(.97) } 51% { transform: scaleY(.39) } 71% { transform: scaleY(.76) } 100% { transform: scaleY(.27) } }
    @keyframes beat-h { 0% { transform: scaleY(.89) } 15% { transform: scaleY(.46) } 33% { transform: scaleY(.21) } 53% { transform: scaleY(.71) } 69% { transform: scaleY(.38) } 91% { transform: scaleY(1) } 100% { transform: scaleY(.57) } }
    @keyframes orbit { to { transform: rotate(360deg) } }
    @keyframes orbit-reverse { to { transform: rotate(-360deg) } }
    @keyframes scan { 0%, 100% { transform: translateY(-18px); opacity: 0 } 15%, 75% { opacity: .55 } 90% { transform: translateY(190px); opacity: 0 } }
    .orbit-a, .orbit-b { transform-box: fill-box; transform-origin: 50% 50%; }
    .orbit-a { animation: orbit 10s linear infinite; }
    .orbit-b { animation: orbit-reverse 7s linear infinite; }
    .scan { animation: scan 4.5s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      .bar { animation: none !important; transform: scaleY(.58); }
      .orbit-a, .orbit-b, .scan { animation: none !important; }
    }
  </style>

  <rect width="1200" height="330" fill="#050608"/>
  <rect width="1200" height="330" fill="url(#grid)"/>
  <rect x="22" y="22" width="1156" height="286" rx="22" fill="url(#panel)" stroke="#26323a" stroke-width="2"/>
  <path d="M46 23H266" stroke="#f02e4d" stroke-width="3"/>
  <path d="M974 307h180" stroke="#00d9f5" stroke-width="3"/>

  <g aria-label="Eternity artwork">
    <rect x="54" y="54" width="172" height="222" rx="15" fill="url(#cover)" stroke="#5d2631"/>
    <path d="M54 80h172M54 250h172" stroke="#f02e4d" stroke-opacity=".32"/>
    <circle cx="140" cy="165" r="61" fill="none" stroke="#f02e4d" stroke-width="2" stroke-dasharray="3 9" class="orbit-a"/>
    <g class="orbit-b">
      <rect x="97" y="122" width="86" height="86" rx="12" fill="none" stroke="#00d9f5" stroke-width="2" transform="rotate(45 140 165)"/>
    </g>
    <circle cx="140" cy="165" r="34" fill="#080a0d" stroke="#f02e4d" stroke-width="3" filter="url(#red-glow)"/>
    <text x="140" y="174" class="ui" text-anchor="middle" font-size="27" font-weight="800" fill="#f3f7f8" letter-spacing="-2">HA</text>
    <path d="M71 71h42M71 258h26" stroke="#00d9f5" stroke-width="2"/>
    <text x="140" y="91" class="mono" text-anchor="middle" font-size="10" fill="#95a7b1" letter-spacing="2">ETERNITY</text>
    <text x="140" y="260" class="mono" text-anchor="middle" font-size="9" fill="#95a7b1" letter-spacing="1.5">HYYANK / 128</text>
    <path d="M61 62h158" class="scan" stroke="#00d9f5" stroke-width="1" filter="url(#cyan-glow)"/>
  </g>

  <g class="ui">
    <text x="268" y="79" font-size="12" font-weight="700" fill="#f02e4d" letter-spacing="2.6">NOW PLAYING</text>
    <text x="268" y="126" font-size="39" font-weight="800" fill="#f3f7f8" letter-spacing="-1.5">Eternity</text>
    <text x="270" y="158" font-size="18" font-weight="600" fill="#a7b5bc">HyyAnk</text>
    <line x1="268" y1="188" x2="464" y2="188" stroke="#33414a"/>
    <text x="268" y="221" class="mono" font-size="14" fill="#00d9f5" letter-spacing="1.6">128 BPM</text>
    <text x="268" y="248" class="mono" font-size="10" fill="#71818a" letter-spacing="1.2">CONCEPT SIGNAL / PROFILE EDITION</text>
  </g>

