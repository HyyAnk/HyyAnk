<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">HyyAnk, designer and maker</title>
  <desc id="desc">Animated kinetic typography with crimson and cyan registration layers.</desc>
  <style>
    :root { color-scheme: dark; }
    .motion { animation-play-state: running; }
    .glitch-red { animation: redShift 4.8s steps(1, end) infinite; }
    .glitch-cyan { animation: cyanShift 4.8s steps(1, end) infinite; }
    .scan { animation: scan 7s linear infinite; }
    .orbit { transform-box: fill-box; transform-origin: center; animation: orbit 16s linear infinite; }
    .pulse { animation: pulse 2.8s ease-in-out infinite; }
    .draw { stroke-dasharray: 820; stroke-dashoffset: 820; animation: draw 2.2s cubic-bezier(.16,1,.3,1) .15s forwards; }
    @keyframes redShift {
      0%, 83%, 100% { transform: translate(0, 0); opacity: .28; }
      84% { transform: translate(-8px, 2px); opacity: .82; }
      85% { transform: translate(5px, -1px); opacity: .18; }
      86% { transform: translate(0, 0); opacity: .28; }
    }
    @keyframes cyanShift {
      0%, 83%, 100% { transform: translate(0, 0); opacity: .24; }
      84% { transform: translate(8px, -2px); opacity: .64; }
      85% { transform: translate(-4px, 1px); opacity: .12; }
      86% { transform: translate(0, 0); opacity: .24; }
    }
    @keyframes scan { from { transform: translateY(-40px); } to { transform: translateY(590px); } }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { opacity: .32; } 50% { opacity: 1; } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .motion, .glitch-red, .glitch-cyan, .scan, .orbit, .pulse, .draw { animation: none !important; }
      .draw { stroke-dashoffset: 0; }
    }
  </style>

  <rect width="1400" height="560" fill="#080a0d" />
  <g opacity=".25" stroke="#d9ded7" stroke-width="1">
    <path d="M0 92H1400M0 184H1400M0 276H1400M0 368H1400M0 460H1400" />
    <path d="M92 0V560M184 0V560M276 0V560M368 0V560M460 0V560M552 0V560M644 0V560M736 0V560M828 0V560M920 0V560M1012 0V560M1104 0V560M1196 0V560M1288 0V560" />
  </g>

  <g fill="#d7dbd4" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="4">
    <text x="58" y="58">HYYANK / DESIGN + BUILD</text>
  </g>

  <g transform="translate(1160 292)">
    <circle r="135" fill="#0f1216" stroke="#f02e4d" stroke-width="3" />
    <circle r="122" fill="none" stroke="#263d44" stroke-width="1" />
    <g class="orbit">
      <polygon points="14.8,6.6 17.9,8.7 20.8,10.9 23.7,13.4 26.4,16.1 28.9,18.9 31.3,21.9 33.5,25.1 35.6,28.4 37.4,31.9 39.1,35.5 40.6,39.3 41.9,43.2 42.9,47.2 43.8,51.4 44.4,55.6 44.8,59.9 45.0,64.3 44.9,68.8 44.6,73.3 44.1,77.9 43.3,82.5 42.2,87.1 40.9,91.8 39.4,96.4 37.6,101.0 35.5,105.7 33.2,110.2 30.6,114.8 88.5,79.2 88.9,73.2 88.9,67.3 88.6,61.5 87.9,55.8 87.0,50.3 85.7,45.0 84.2,39.9 82.4,35.0 80.3,30.3 78.0,25.8 75.5,21.6 72.7,17.6 69.8,13.9 66.7,10.4 63.4,7.3 60.0,4.4 56.5,1.8 52.8,-0.5 49.1,-2.5 45.3,-4.2 41.5,-5.5 37.6,-6.6 33.7,-7.4 29.9,-7.8 26.0,-8.0 22.2,-7.8 18.5,-7.3 14.8,-6.6" fill="#f02e4d" stroke="#00d9f5" stroke-width="2" />
      <use href="#itachi-blade" transform="rotate(120)" />
      <use href="#itachi-blade" transform="rotate(240)" />
    </g>
    <circle class="pulse" r="18" fill="#080a0d" stroke="#f2f5f6" stroke-width="2" />
    <circle class="pulse" r="6" fill="#f02e4d" />
  </g>

  <defs>
    <polygon id="itachi-blade" points="14.8,6.6 17.9,8.7 20.8,10.9 23.7,13.4 26.4,16.1 28.9,18.9 31.3,21.9 33.5,25.1 35.6,28.4 37.4,31.9 39.1,35.5 40.6,39.3 41.9,43.2 42.9,47.2 43.8,51.4 44.4,55.6 44.8,59.9 45.0,64.3 44.9,68.8 44.6,73.3 44.1,77.9 43.3,82.5 42.2,87.1 40.9,91.8 39.4,96.4 37.6,101.0 35.5,105.7 33.2,110.2 30.6,114.8 88.5,79.2 88.9,73.2 88.9,67.3 88.6,61.5 87.9,55.8 87.0,50.3 85.7,45.0 84.2,39.9 82.4,35.0 80.3,30.3 78.0,25.8 75.5,21.6 72.7,17.6 69.8,13.9 66.7,10.4 63.4,7.3 60.0,4.4 56.5,1.8 52.8,-0.5 49.1,-2.5 45.3,-4.2 41.5,-5.5 37.6,-6.6 33.7,-7.4 29.9,-7.8 26.0,-8.0 22.2,-7.8 18.5,-7.3 14.8,-6.6" fill="#f02e4d" stroke="#00d9f5" stroke-width="2" />
  </defs>

  <g font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="214" font-weight="900" letter-spacing="-15">
    <text class="glitch-cyan motion" x="56" y="342" fill="none" stroke="#00d9f5" stroke-width="3">HyyAnk</text>
    <text class="glitch-red motion" x="56" y="342" fill="none" stroke="#f02e4d" stroke-width="4">HyyAnk</text>
    <text x="56" y="342" fill="#f2f5f6">HyyAnk</text>
  </g>

  <path class="draw" d="M57 386H940L1002 442H1310" fill="none" stroke="#f02e4d" stroke-width="3" />
  <path class="draw" d="M57 400H700" fill="none" stroke="#00d9f5" stroke-width="2" opacity=".7" />

  <g class="scan motion" opacity=".16">
    <rect x="0" y="0" width="1400" height="2" fill="#f1f1e9" />
    <rect x="0" y="8" width="1400" height="1" fill="#f02e4d" />
  </g>
</svg>
