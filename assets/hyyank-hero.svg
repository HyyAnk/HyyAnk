<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">HyyAnk, designer and maker</title>
  <desc id="desc">Animated kinetic typography with acid lime and cobalt registration layers.</desc>
  <style>
    :root { color-scheme: dark; }
    .motion { animation-play-state: running; }
    .glitch-lime { animation: limeShift 4.8s steps(1, end) infinite; }
    .glitch-blue { animation: blueShift 4.8s steps(1, end) infinite; }
    .scan { animation: scan 7s linear infinite; }
    .orbit { transform-box: fill-box; transform-origin: center; animation: orbit 16s linear infinite; }
    .pulse { animation: pulse 2.8s ease-in-out infinite; }
    .draw { stroke-dasharray: 820; stroke-dashoffset: 820; animation: draw 2.2s cubic-bezier(.16,1,.3,1) .15s forwards; }
    @keyframes limeShift {
      0%, 83%, 100% { transform: translate(0, 0); opacity: .28; }
      84% { transform: translate(-8px, 2px); opacity: .82; }
      85% { transform: translate(5px, -1px); opacity: .18; }
      86% { transform: translate(0, 0); opacity: .28; }
    }
    @keyframes blueShift {
      0%, 83%, 100% { transform: translate(0, 0); opacity: .24; }
      84% { transform: translate(8px, -2px); opacity: .64; }
      85% { transform: translate(-4px, 1px); opacity: .12; }
      86% { transform: translate(0, 0); opacity: .24; }
    }
    @keyframes scan { from { transform: translateY(-40px); } to { transform: translateY(590px); } }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { opacity: .32; } 50% { opacity: 1; } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .motion, .glitch-lime, .glitch-blue, .scan, .orbit, .pulse, .draw { animation: none !important; }
      .draw { stroke-dashoffset: 0; }
    }
  </style>

  <rect width="1400" height="560" fill="#0b0e0e" />
  <g opacity=".25" stroke="#d9ded7" stroke-width="1">
    <path d="M0 92H1400M0 184H1400M0 276H1400M0 368H1400M0 460H1400" />
    <path d="M92 0V560M184 0V560M276 0V560M368 0V560M460 0V560M552 0V560M644 0V560M736 0V560M828 0V560M920 0V560M1012 0V560M1104 0V560M1196 0V560M1288 0V560" />
  </g>

  <g fill="#d7dbd4" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="4">
    <text x="58" y="58">HYYANK / DESIGN + BUILD</text>
  </g>

  <g class="orbit" fill="none" stroke="#c7ff1a" stroke-width="2" opacity=".7">
    <circle cx="1160" cy="292" r="135" stroke-dasharray="5 14" />
    <circle cx="1160" cy="292" r="98" stroke-dasharray="2 11" opacity=".55" />
    <path d="M1160 139V445M1007 292H1313" opacity=".3" />
  </g>
  <g class="pulse" fill="#c7ff1a">
    <circle cx="1160" cy="292" r="6" />
    <circle cx="1011" cy="292" r="4" />
    <circle cx="1288" cy="205" r="4" />
  </g>

  <g font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="214" font-weight="900" letter-spacing="-15">
    <text class="glitch-blue motion" x="56" y="342" fill="none" stroke="#2f64d6" stroke-width="3">HyyAnk</text>
    <text class="glitch-lime motion" x="56" y="342" fill="none" stroke="#c7ff1a" stroke-width="4">HyyAnk</text>
    <text x="56" y="342" fill="#f1f1e9">HyyAnk</text>
  </g>

  <path class="draw" d="M57 386H940L1002 442H1310" fill="none" stroke="#c7ff1a" stroke-width="3" />
  <path class="draw" d="M57 400H700" fill="none" stroke="#2f64d6" stroke-width="2" opacity=".7" />

  <g class="scan motion" opacity=".16">
    <rect x="0" y="0" width="1400" height="2" fill="#f1f1e9" />
    <rect x="0" y="8" width="1400" height="1" fill="#c7ff1a" />
  </g>
</svg>
